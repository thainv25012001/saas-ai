type Agent {
  id: UUID!
  name: String!
  slug: String!
  status: AgentStatus!
  provider: String!
  model: String!
  temperature: Float!
  maxTokens: Int!
  promptId: UUID
  createdAt: DateTime!
  updatedAt: DateTime!
  config: AgentConfig
}

type AgentConfig {
  id: UUID!
  tone: String!
  language: String!
  persona: String
  greeting: String
  fallbackMessage: String!
  retrievalTopK: Int!
  retrievalMinScore: Float!
  maxAgentSteps: Int!
}

enum AgentStatus {
  DRAFT
  ACTIVE
  DISABLED
}

type AgentTool {
  id: UUID!
  name: String!
  description: String
  isEnabled: Boolean!
}

type Conversation {
  id: UUID!
  agentId: UUID!
  channel: ConversationChannel!
  status: ConversationStatus!
  title: String
  lastMessageAt: DateTime
  createdAt: DateTime!
  preview: String
  messages: [Message!]!
}

enum ConversationChannel {
  PLAYGROUND
  WIDGET
  API
}

enum ConversationStatus {
  OPEN
  CLOSED
}

input CreateAgentInput {
  name: String!
  provider: String!
  model: String!
  temperature: Float! = 0.3
  maxTokens: Int! = 1024
}

input CreatePromptInput {
  name: String!
  key: String!
  systemPrompt: String!
  description: String = null
}

input CreatePromptVersionInput {
  systemPrompt: String!
  notes: String = null
}

"""Date with time (isoformat)"""
scalar DateTime

type Document {
  id: UUID!
  title: String!
  status: DocumentStatus!
  mimeType: String
  fileSize: Int
  checksum: String
  error: String
  createdAt: DateTime!
  processedAt: DateTime
  chunkCount: Int!
}

enum DocumentStatus {
  PENDING
  PROCESSING
  READY
  FAILED
}

type Lead {
  id: UUID!
  agentId: UUID!
  conversationId: UUID!
  name: String
  email: String
  phone: String
  interest: String
  status: LeadStatus!
  createdAt: DateTime!
  conversation: Conversation
}

enum LeadStatus {
  NEW
  CONTACTED
  QUALIFIED
  WON
  LOST
}

type Me {
  userId: UUID!
  email: String!
  fullName: String!
  organizationId: UUID!
  organizationName: String!
  role: String!
}

type Message {
  id: UUID!
  seq: Int!
  role: MessageRole!
  content: String
  provider: String
  model: String
  inputTokens: Int
  outputTokens: Int
  costUsd: String
  latencyMs: Int
  finishReason: String
  error: String
  createdAt: DateTime!
  citations: [MessageCitation!]!
}

type MessageCitation {
  id: UUID!
  chunkId: UUID
  documentId: UUID
  documentTitle: String!
  excerpt: String!
  rank: Int!
  score: Float!
}

enum MessageRole {
  USER
  ASSISTANT
  SYSTEM
  TOOL
}

type ModelOption {
  id: String!
  label: String!
  contextLength: Int
}

type Mutation {
  createAgent(input: CreateAgentInput!): Agent!
  updateAgent(id: UUID!, input: UpdateAgentInput!): Agent!
  updateAgentConfig(agentId: UUID!, input: UpdateAgentConfigInput!): AgentConfig!
  deleteAgent(id: UUID!): Boolean!
  createPrompt(input: CreatePromptInput!): Prompt!
  createPromptVersion(promptId: UUID!, input: CreatePromptVersionInput!): PromptVersion!
  activatePromptVersion(versionId: UUID!): PromptVersion!
  deleteDocument(id: UUID!): Boolean!
  setAgentToolEnabled(agentId: UUID!, toolId: UUID!, isEnabled: Boolean!): AgentTool!
}

type Organization {
  id: UUID!
  name: String!
  slug: String!
  plan: String!
  createdAt: DateTime!
}

type Product {
  id: UUID!
  externalId: String!
  name: String!
  description: String
  category: String
  price: String
  currency: String
  attributes: [ProductAttribute!]!
  availability: ProductAvailability!
  stockQuantity: Int
  isActive: Boolean!
  searchIndex: ProductSearchIndex!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProductAttribute {
  key: String!
  value: String!
}

enum ProductAvailability {
  IN_STOCK
  OUT_OF_STOCK
  PREORDER
  DISCONTINUED
}

type ProductImport {
  id: UUID!
  filename: String
  status: ProductImportStatus!
  totalRows: Int
  succeededCount: Int!
  failedCount: Int!
  error: String
  createdAt: DateTime!
  completedAt: DateTime
  errors(limit: Int! = 50): [ProductImportRowError!]!
}

type ProductImportRowError {
  row: Int!
  externalId: String
  message: String!
}

enum ProductImportStatus {
  PENDING
  PROCESSING
  COMPLETED
  FAILED
}

enum ProductSearchIndex {
  INDEXED
  NOT_INDEXED
  STALE
}

type Prompt {
  id: UUID!
  name: String!
  key: String!
  description: String
  createdAt: DateTime!
}

type PromptVersion {
  id: UUID!
  version: Int!
  systemPrompt: String!
  isActive: Boolean!
  notes: String
  createdAt: DateTime!
}

type ProviderInfo {
  id: String!
  configured: Boolean!
}

type Query {
  me: Me!
  organization: Organization!
  agents: [Agent!]!
  agent(id: UUID!): Agent!
  providerModels(provider: String!): [ModelOption!]!
  configuredProviders: [ProviderInfo!]!
  prompts: [Prompt!]!
  prompt(id: UUID!): Prompt!
  documents(status: DocumentStatus = null, limit: Int! = 50, offset: Int! = 0): [Document!]!
  conversations(agentId: UUID!, channel: ConversationChannel = null, limit: Int! = 20, offset: Int! = 0): [Conversation!]!
  conversation(id: UUID!): Conversation
  document(id: UUID!): Document
  leads(agentId: UUID!, limit: Int! = 50, offset: Int! = 0): [Lead!]!
  products(search: String = null, category: String = null, availability: ProductAvailability = null, limit: Int! = 50, offset: Int! = 0): [Product!]!
  productCategories: [String!]!
  productImports(limit: Int! = 20, offset: Int! = 0): [ProductImport!]!
  agentTools(agentId: UUID!): [AgentTool!]!
}

scalar UUID

input UpdateAgentConfigInput {
  persona: String = null
  tone: String = null
  language: String = null
  greeting: String = null
  fallbackMessage: String = null
  retrievalTopK: Int = null
  retrievalMinScore: Float = null
  maxAgentSteps: Int = null
}

input UpdateAgentInput {
  name: String = null
  status: AgentStatus = null
  provider: String = null
  model: String = null
  temperature: Float = null
  maxTokens: Int = null
}
