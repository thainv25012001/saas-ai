type Agent {
  id: UUID!
  name: String!
  slug: String!
  status: AgentStatus!
  provider: String!
  model: String!
  temperature: Float!
  maxTokens: Int!
  promptId: UUID
  publicKey: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  config: AgentConfig
}

type AgentConfig {
  id: UUID!
  tone: String!
  language: String!
  persona: String
  greeting: String
  fallbackMessage: String!
  retrievalTopK: Int!
  retrievalMinScore: Float!
  maxAgentSteps: Int!
}

enum AgentStatus {
  DRAFT
  ACTIVE
  DISABLED
}

type AgentTool {
  id: UUID!
  name: String!
  description: String
  isEnabled: Boolean!
}

type ApiKey {
  id: UUID!
  name: String!
  keyPrefix: String!
  agentId: UUID!
  createdAt: DateTime!
  lastUsedAt: DateTime
  revokedAt: DateTime
  createdByName: String
}

type Conversation {
  id: UUID!
  agentId: UUID!
  channel: ConversationChannel!
  status: ConversationStatus!
  title: String
  lastMessageAt: DateTime
  createdAt: DateTime!
  preview: String
  messages: [Message!]!
}

enum ConversationChannel {
  PLAYGROUND
  WIDGET
  API
}

enum ConversationStatus {
  OPEN
  CLOSED
}

input CreateAgentInput {
  name: String!
  provider: String!
  model: String!
  temperature: Float! = 0.3
  maxTokens: Int! = 1024
}

input CreateEvaluationDatasetInput {
  name: String!
  description: String = null
}

input CreatePromptInput {
  name: String!
  key: String!
  systemPrompt: String!
  description: String = null
}

input CreatePromptVersionInput {
  systemPrompt: String!
  notes: String = null
}

type CreatedApiKey {
  apiKey: ApiKey!
  token: String!
}

"""Date with time (isoformat)"""
scalar DateTime

type Document {
  id: UUID!
  title: String!
  status: DocumentStatus!
  mimeType: String
  fileSize: Int
  checksum: String
  error: String
  createdAt: DateTime!
  processedAt: DateTime
  chunkCount: Int!
}

enum DocumentStatus {
  PENDING
  PROCESSING
  READY
  FAILED
}

type EvaluationCase {
  id: UUID!
  question: String!
  referenceAnswer: String
  requiredPhrases: [String!]!
  expectedToolNames: [String!]!
  expectedDocumentIds: [UUID!]!
  expectedProductIds: [UUID!]!
  tags: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input EvaluationCaseInput {
  question: String!
  referenceAnswer: String = null
  requiredPhrases: [String!]! = []
  expectedToolNames: [String!]! = []
  expectedDocumentIds: [UUID!]! = []
  expectedProductIds: [UUID!]! = []
  tags: [String!]! = []
}

type EvaluationDataset {
  id: UUID!
  name: String!
  description: String
  createdAt: DateTime!
  updatedAt: DateTime!
  caseCount: Int!
  latestRun: EvaluationRun
}

type EvaluationResult {
  id: UUID!
  caseId: UUID
  question: String!
  answer: String
  error: String
  passed: Boolean!
  citedDocumentIds: [UUID!]!
  citedProductIds: [UUID!]!
  promptVersionId: UUID
  latencyMs: Int
  inputTokens: Int
  outputTokens: Int
  costUsd: String
  createdAt: DateTime!
  scores: [EvaluationScore!]!
  toolCalls: [EvaluationToolCall!]!
}

type EvaluationRun {
  id: UUID!
  datasetId: UUID!
  agentId: UUID!
  promptVersionId: UUID
  provider: String!
  model: String!
  judgeProvider: String
  judgeModel: String
  status: EvaluationRunStatus!
  caseCount: Int!
  completedCount: Int!
  error: String
  triggeredBy: UUID
  createdAt: DateTime!
  startedAt: DateTime
  finishedAt: DateTime
  summary: EvaluationRunSummary
  agentName: String
  promptVersion: Int
  results: [EvaluationResult!]!
}

enum EvaluationRunStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
}

type EvaluationRunSummary {
  passed: Int!
  failed: Int!
  errored: Int!
  passRate: Float
  costUsd: String
  meanLatencyMs: Int
  scorers: [EvaluationScorerSummary!]!
}

type EvaluationScore {
  name: String!
  score: Float
  passed: Boolean!
  status: String!
  detail: String!
}

type EvaluationScorerSummary {
  name: String!
  mean: Float
  passed: Int!
  applicable: Int!
}

type EvaluationToolCall {
  name: String!
  arguments: String!
  isError: Boolean!
  excerpt: String!
}

type Lead {
  id: UUID!
  agentId: UUID!
  conversationId: UUID!
  name: String
  email: String
  phone: String
  interest: String
  status: LeadStatus!
  source: String
  createdAt: DateTime!
  conversation: Conversation
}

enum LeadStatus {
  NEW
  CONTACTED
  QUALIFIED
  WON
  LOST
}

type McpInfo {
  exposedToolNames: [String!]!
}

type Me {
  userId: UUID!
  email: String!
  fullName: String!
  organizationId: UUID!
  organizationName: String!
  role: String!
}

type Message {
  id: UUID!
  seq: Int!
  role: MessageRole!
  content: String
  provider: String
  model: String
  inputTokens: Int
  outputTokens: Int
  costUsd: String
  latencyMs: Int
  finishReason: String
  error: String
  createdAt: DateTime!
  citations: [MessageCitation!]!
}

type MessageCitation {
  id: UUID!
  chunkId: UUID
  documentId: UUID
  productId: UUID
  documentTitle: String!
  excerpt: String!
  rank: Int!
  score: Float!
}

enum MessageRole {
  USER
  ASSISTANT
  SYSTEM
  TOOL
}

type ModelOption {
  id: String!
  label: String!
  contextLength: Int
}

type Mutation {
  createAgent(input: CreateAgentInput!): Agent!
  updateAgent(id: UUID!, input: UpdateAgentInput!): Agent!
  updateAgentConfig(agentId: UUID!, input: UpdateAgentConfigInput!): AgentConfig!
  deleteAgent(id: UUID!): Boolean!
  setAgentPrompt(agentId: UUID!, promptId: UUID = null): Agent!
  createPrompt(input: CreatePromptInput!): Prompt!
  createPromptVersion(promptId: UUID!, input: CreatePromptVersionInput!): PromptVersion!
  activatePromptVersion(versionId: UUID!): PromptVersion!
  deleteDocument(id: UUID!): Boolean!
  setAgentToolEnabled(agentId: UUID!, toolId: UUID!, isEnabled: Boolean!): AgentTool!
  createEvaluationDataset(input: CreateEvaluationDatasetInput!): EvaluationDataset!
  updateEvaluationDataset(id: UUID!, input: UpdateEvaluationDatasetInput!): EvaluationDataset!
  deleteEvaluationDataset(id: UUID!): Boolean!
  createEvaluationCase(datasetId: UUID!, input: EvaluationCaseInput!): EvaluationCase!
  updateEvaluationCase(id: UUID!, input: EvaluationCaseInput!): EvaluationCase!
  deleteEvaluationCase(id: UUID!): Boolean!
  cancelEvaluationRun(id: UUID!): EvaluationRun!
  createApiKey(agentId: UUID!, name: String!): CreatedApiKey!
  revokeApiKey(id: UUID!): ApiKey!
  updateWidgetSettings(agentId: UUID!, input: UpdateWidgetSettingsInput!): WidgetSettings!
}

type Organization {
  id: UUID!
  name: String!
  slug: String!
  plan: String!
  createdAt: DateTime!
}

type Product {
  id: UUID!
  externalId: String!
  name: String!
  description: String
  category: String
  price: String
  currency: String
  attributes: [ProductAttribute!]!
  availability: ProductAvailability!
  stockQuantity: Int
  isActive: Boolean!
  searchIndex: ProductSearchIndex!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProductAttribute {
  key: String!
  value: String!
}

enum ProductAvailability {
  IN_STOCK
  OUT_OF_STOCK
  PREORDER
  DISCONTINUED
}

type ProductImport {
  id: UUID!
  filename: String
  status: ProductImportStatus!
  totalRows: Int
  succeededCount: Int!
  failedCount: Int!
  error: String
  createdAt: DateTime!
  completedAt: DateTime
  errors(limit: Int! = 50): [ProductImportRowError!]!
}

type ProductImportRowError {
  row: Int!
  externalId: String
  message: String!
}

enum ProductImportStatus {
  PENDING
  PROCESSING
  COMPLETED
  FAILED
}

enum ProductSearchIndex {
  INDEXED
  NOT_INDEXED
  STALE
}

type Prompt {
  id: UUID!
  name: String!
  key: String!
  description: String
  createdAt: DateTime!
  versions: [PromptVersion!]!
  agents: [Agent!]!
}

type PromptVersion {
  id: UUID!
  version: Int!
  systemPrompt: String!
  isActive: Boolean!
  notes: String
  createdAt: DateTime!
}

type ProviderInfo {
  id: String!
  configured: Boolean!
}

type Query {
  me: Me!
  organization: Organization!
  agents: [Agent!]!
  agent(id: UUID!): Agent!
  providerModels(provider: String!): [ModelOption!]!
  configuredProviders: [ProviderInfo!]!
  prompts: [Prompt!]!
  prompt(id: UUID!): Prompt!
  defaultSystemPrompt: String!
  documents(status: DocumentStatus = null, limit: Int! = 50, offset: Int! = 0): [Document!]!
  conversations(agentId: UUID!, channel: ConversationChannel = null, limit: Int! = 20, offset: Int! = 0): [Conversation!]!
  conversation(id: UUID!): Conversation
  document(id: UUID!): Document
  leads(agentId: UUID!, limit: Int! = 50, offset: Int! = 0): [Lead!]!
  products(search: String = null, category: String = null, availability: ProductAvailability = null, limit: Int! = 50, offset: Int! = 0): [Product!]!
  productCategories: [String!]!
  productImports(limit: Int! = 20, offset: Int! = 0): [ProductImport!]!
  agentTools(agentId: UUID!): [AgentTool!]!
  evaluationDatasets: [EvaluationDataset!]!
  evaluationDataset(id: UUID!): EvaluationDataset!
  evaluationCases(datasetId: UUID!): [EvaluationCase!]!
  evaluationRuns(datasetId: UUID = null, limit: Int! = 20): [EvaluationRun!]!
  evaluationRun(id: UUID!): EvaluationRun
  apiKeys(agentId: UUID!): [ApiKey!]!
  agentMcpInfo(agentId: UUID!): McpInfo!
  widgetSettings(agentId: UUID!): WidgetSettings!
}

scalar UUID

input UpdateAgentConfigInput {
  persona: String = null
  tone: String = null
  language: String = null
  greeting: String = null
  fallbackMessage: String = null
  retrievalTopK: Int = null
  retrievalMinScore: Float = null
  maxAgentSteps: Int = null
}

input UpdateAgentInput {
  name: String = null
  status: AgentStatus = null
  provider: String = null
  model: String = null
  temperature: Float = null
  maxTokens: Int = null
}

input UpdateEvaluationDatasetInput {
  name: String = null
  description: String = null
}

input UpdateWidgetSettingsInput {
  enabled: Boolean!
  allowedOrigins: [String!]!
  brandColor: String!
  position: WidgetPosition!
  title: String = null
  dailyMessageCap: Int!
}

enum WidgetPosition {
  RIGHT
  LEFT
}

type WidgetSettings {
  agentId: UUID!
  enabled: Boolean!
  allowedOrigins: [String!]!
  brandColor: String!
  position: WidgetPosition!
  title: String
  dailyMessageCap: Int!
}
