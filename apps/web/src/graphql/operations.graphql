query Agents {
  agents { id name slug status model provider createdAt }
}

query Agent($id: UUID!) {
  agent(id: $id) {
    id name slug status provider model temperature maxTokens
    config { id tone language persona greeting fallbackMessage retrievalTopK maxAgentSteps }
  }
}

mutation CreateAgent($name: String!, $provider: String!, $model: String!) {
  createAgent(input: { name: $name, provider: $provider, model: $model }) {
    id name slug status provider model
  }
}

mutation UpdateAgent($id: UUID!, $input: UpdateAgentInput!) {
  updateAgent(id: $id, input: $input) {
    id name slug status provider model temperature maxTokens
  }
}

mutation UpdateAgentConfig($agentId: UUID!, $input: UpdateAgentConfigInput!) {
  updateAgentConfig(agentId: $agentId, input: $input) {
    id tone retrievalTopK maxAgentSteps
  }
}

mutation DeleteAgent($id: UUID!) {
  deleteAgent(id: $id)
}

query ProviderModels($provider: String!) {
  providerModels(provider: $provider) { id label contextLength }
}

query ConfiguredProviders {
  configuredProviders { id configured }
}

query Documents($status: DocumentStatus, $limit: Int, $offset: Int) {
  documents(status: $status, limit: $limit, offset: $offset) {
    id title status mimeType fileSize error createdAt processedAt chunkCount
  }
}

mutation DeleteDocument($id: UUID!) {
  deleteDocument(id: $id)
}

query Conversations($agentId: UUID!, $channel: ConversationChannel, $limit: Int, $offset: Int) {
  conversations(agentId: $agentId, channel: $channel, limit: $limit, offset: $offset) {
    id title preview
  }
}

query Conversation($id: UUID!) {
  conversation(id: $id) {
    id
    title
    messages {
      id seq role content model inputTokens outputTokens costUsd latencyMs error
      citations { chunkId documentId productId documentTitle excerpt rank score }
    }
  }
}

query Leads($agentId: UUID!, $limit: Int, $offset: Int) {
  leads(agentId: $agentId, limit: $limit, offset: $offset) {
    id name email phone interest status createdAt
    conversation { id title preview }
  }
}

query AgentTools($agentId: UUID!) {
  agentTools(agentId: $agentId) { id name description isEnabled }
}

mutation SetAgentToolEnabled($agentId: UUID!, $toolId: UUID!, $isEnabled: Boolean!) {
  setAgentToolEnabled(agentId: $agentId, toolId: $toolId, isEnabled: $isEnabled) {
    id name description isEnabled
  }
}

query Products(
  $search: String
  $category: String
  $availability: ProductAvailability
  $limit: Int
  $offset: Int
) {
  products(
    search: $search
    category: $category
    availability: $availability
    limit: $limit
    offset: $offset
  ) {
    id externalId name description category price currency
    attributes { key value }
    availability stockQuantity isActive searchIndex updatedAt
  }
}

query ProductCategories {
  productCategories
}

query ProductImports($limit: Int) {
  productImports(limit: $limit) {
    id filename status totalRows succeededCount failedCount error createdAt completedAt
    errors { row externalId message }
  }
}

# --- Evaluations (Phase 6) -------------------------------------------------

query AgentPrompt($id: UUID!) {
  agent(id: $id) { id provider model promptId }
}

query PromptVersions($id: UUID!) {
  prompt(id: $id) { id versions { id version isActive createdAt } }
}

query EvaluationDatasets {
  evaluationDatasets {
    id name description caseCount createdAt
    latestRun { id status createdAt summary { passRate } }
  }
}

query EvaluationDataset($id: UUID!) {
  evaluationDataset(id: $id) { id name description caseCount }
}

mutation CreateEvaluationDataset($input: CreateEvaluationDatasetInput!) {
  createEvaluationDataset(input: $input) { id }
}

mutation UpdateEvaluationDataset($id: UUID!, $input: UpdateEvaluationDatasetInput!) {
  updateEvaluationDataset(id: $id, input: $input) { id name description }
}

mutation DeleteEvaluationDataset($id: UUID!) {
  deleteEvaluationDataset(id: $id)
}

query EvaluationCases($datasetId: UUID!) {
  evaluationCases(datasetId: $datasetId) {
    id question referenceAnswer requiredPhrases expectedToolNames
    expectedDocumentIds expectedProductIds tags
  }
}

mutation CreateEvaluationCase($datasetId: UUID!, $input: EvaluationCaseInput!) {
  createEvaluationCase(datasetId: $datasetId, input: $input) { id }
}

mutation UpdateEvaluationCase($id: UUID!, $input: EvaluationCaseInput!) {
  updateEvaluationCase(id: $id, input: $input) { id }
}

mutation DeleteEvaluationCase($id: UUID!) {
  deleteEvaluationCase(id: $id)
}

query EvaluationRuns($datasetId: UUID, $limit: Int) {
  evaluationRuns(datasetId: $datasetId, limit: $limit) {
    id status caseCount completedCount provider model judgeProvider judgeModel
    agentName promptVersion createdAt startedAt finishedAt
    summary { passRate costUsd }
  }
}

query EvaluationRun($id: UUID!) {
  evaluationRun(id: $id) {
    id datasetId agentId agentName promptVersionId promptVersion
    provider model judgeProvider judgeModel status caseCount completedCount error
    createdAt startedAt finishedAt
    summary {
      passed failed errored passRate costUsd meanLatencyMs
      scorers { name mean passed applicable }
    }
    results {
      id caseId question answer error passed citedDocumentIds citedProductIds
      latencyMs costUsd
      scores { name score passed status detail }
      toolCalls { name arguments isError excerpt }
    }
  }
}

query EvaluationRunOutcomes($id: UUID!) {
  evaluationRun(id: $id) { id results { id caseId question passed } }
}

mutation CancelEvaluationRun($id: UUID!) {
  cancelEvaluationRun(id: $id) { id status }
}

query ProductPicker($search: String, $limit: Int) {
  products(search: $search, limit: $limit) { id name externalId }
}
