# Configuration comes from the root `.env`, which Compose loads automatically for
# `${...}` interpolation. Every value below has a local-container default, so a
# clone with no `.env` still works; setting a variable in `.env` overrides it.
#
# `db` and `redis` sit behind the `local-infra` profile. `.env.example` enables
# that profile via COMPOSE_PROFILES, so the default experience is unchanged. Point
# DATABASE_URL / REDIS_URL at managed services and drop COMPOSE_PROFILES, and the
# local containers are never started.
services:
  db:
    profiles: ["local-infra"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_ai"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    profiles: ["local-infra"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # NOTE: this container runs `alembic upgrade head` as part of its startup
  # command below. That is convenient for local development (clone, compose
  # up, and the schema is always current) and wrong for production: with
  # more than one replica, every replica would race to apply the same
  # migration concurrently. In production, migrations belong in a separate
  # one-shot job/step that runs once before the new replicas start, not in
  # the container's own entrypoint.
  api:
    build: ./apps/api
    depends_on:
      # `required: false` so these are waited on when the `local-infra` profile
      # is active and simply absent when it is not. Without it, Compose refuses
      # the whole project with "depends on undefined service" as soon as the
      # profile is off — which is exactly the managed-services case.
      db: { condition: service_healthy, required: false }
      redis: { condition: service_healthy, required: false }
    environment:
      # Defaults address the `local-infra` containers by service name. Override
      # any of these in `.env` — e.g. a managed Postgres or Redis URL — and the
      # container picks it up with no change here. Note the hostnames: `db` and
      # `redis` resolve on the compose network, NOT on the host, so a `.env`
      # written for running the API natively (localhost:5432) is wrong here.
      # Managed URLs are reachable identically from both, which is why they are
      # the simpler setup.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:app_user_password@db:5432/saas_ai}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+asyncpg://app_owner:app_owner_password@db:5432/saas_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      # `local` enables the GraphQL IDE and permits the seed script. Override it
      # for anything that is not a developer machine.
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Provider credentials. The repo-root `.env` is NOT inside the
      # `./apps/api` mount below, so `Settings`' env-file walk finds nothing in
      # this container -- without these lines every real provider resolves to
      # `LLMConfigurationError` here, and only the offline `fake` provider
      # works. Unset on the host stays unset in the container (no `:-default`),
      # which is what keeps `fake` the out-of-the-box path.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-fake}
      # Must resolve to the same path inside both `api` and `worker` -- it
      # is where `worker` looks for the bytes `api` just wrote. The `uploads`
      # volume below is what makes that path actually the same *disk*, not
      # just the same string.
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      # ---- Phase 3 (RAG) -------------------------------------------------
      # Passed through explicitly, like every other setting here: the
      # repo-root `.env` is NOT inside the `./apps/api` mount, so
      # `Settings`' env-file walk finds nothing in this container and a
      # variable not named below simply does not exist for the app. That is
      # what made `docs/PHASE-3.md` §2.3's claim -- that swapping in
      # `OpenAIEmbeddingProvider` is "a config change" -- false under
      # compose: setting `OPENAI_API_KEY` alone did nothing, because
      # `EMBEDDING_PROVIDER` never reached the process.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-20971520}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
      EMBEDDING_RETRY_BACKOFF_SECONDS: ${EMBEDDING_RETRY_BACKOFF_SECONDS:-0.1}
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-5}
      # Both floors are properties of the embedding model and the corpus,
      # not of the app -- re-measure them if EMBEDDING_PROVIDER changes.
      RETRIEVAL_MAX_COSINE_DISTANCE: ${RETRIEVAL_MAX_COSINE_DISTANCE:-0.8}
      RETRIEVAL_MIN_KEYWORD_RANK: ${RETRIEVAL_MIN_KEYWORD_RANK:-0.15}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      # Anonymous volume: without it, bind-mounting the host apps/api
      # directory over /app would also shadow /app/.venv with whatever
      # (possibly non-Linux, possibly absent) .venv exists on the host,
      # hiding the Linux virtualenv `uv sync` just built in the image. Same
      # trick as web's node_modules line below.
      - /app/.venv
      # Shared with `worker` -- see the note on its own `uploads` mount.
      - uploads:/data/uploads
    # --no-access-log: uvicorn's own access log line prints the client IP and
    # the full request path (a widget public key included) -- app/main.py's
    # request middleware already logs every request, with a widget key
    # truncated to 8 characters, so uvicorn's line would be a second,
    # unredacted copy of the same request. See docs/DEPLOYMENT.md.
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"
    healthcheck:
      # No curl in python:3.12-slim; urllib is already there. Not "healthy"
      # until this succeeds, which only happens once migrations have
      # finished and uvicorn has started — exactly the signal
      # `docker compose up -d --wait` (see README) needs before it is safe
      # to run anything against the API, e.g. `make seed`.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)\"",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Runs the same image as `api` but as an arq worker instead of the HTTP
  # server, so a large document's extraction/chunking/embedding never holds
  # an HTTP connection (or a request timeout) open. It shares `api`'s image,
  # environment and `upload_dir` volume because it reads the same uploaded
  # bytes `api` wrote and writes to the same tenant-scoped tables.
  worker:
    build: ./apps/api
    depends_on:
      # See the identical note on `api` above: `required: false` so this is
      # only waited on when `local-infra` is active, and simply absent
      # (never refusing the whole project) when it is not.
      db: { condition: service_healthy, required: false }
      redis: { condition: service_healthy, required: false }
    environment:
      # Same block as `api` -- the worker resolves tenants, talks to
      # Postgres/Redis and reads provider keys exactly like the API does,
      # just without an HTTP server on top.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:app_user_password@db:5432/saas_ai}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+asyncpg://app_owner:app_owner_password@db:5432/saas_ai}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-fake}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      # ---- Phase 3 (RAG) -------------------------------------------------
      # Passed through explicitly, like every other setting here: the
      # repo-root `.env` is NOT inside the `./apps/api` mount, so
      # `Settings`' env-file walk finds nothing in this container and a
      # variable not named below simply does not exist for the app. That is
      # what made `docs/PHASE-3.md` §2.3's claim -- that swapping in
      # `OpenAIEmbeddingProvider` is "a config change" -- false under
      # compose: setting `OPENAI_API_KEY` alone did nothing, because
      # `EMBEDDING_PROVIDER` never reached the process.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-20971520}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
      EMBEDDING_RETRY_BACKOFF_SECONDS: ${EMBEDDING_RETRY_BACKOFF_SECONDS:-0.1}
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-5}
      # Both floors are properties of the embedding model and the corpus,
      # not of the app -- re-measure them if EMBEDDING_PROVIDER changes.
      RETRIEVAL_MAX_COSINE_DISTANCE: ${RETRIEVAL_MAX_COSINE_DISTANCE:-0.8}
      RETRIEVAL_MIN_KEYWORD_RANK: ${RETRIEVAL_MIN_KEYWORD_RANK:-0.15}
    volumes:
      - ./apps/api:/app
      - /app/.venv
      # Named, not bind-mounted: this is what makes an upload written by
      # `api` visible to `worker` (and vice versa) regardless of which
      # container's filesystem `settings.upload_dir` would otherwise
      # resolve against. See `app/rag/storage.py` for why this directory --
      # local to whichever host runs these containers -- is a placeholder,
      # not the production design: object storage is what actually needs
      # to back `UPLOAD_DIR` once `api` and `worker` run as more than one
      # replica each, on more than one host.
      - uploads:/data/uploads
    command: uv run arq app.workers.settings.WorkerSettings

  web:
    build: ./apps/web
    depends_on:
      - api
    environment:
      # The browser's view of the API: it reaches the published host port, so
      # this stays `localhost` regardless of the compose network.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # The Next *server's* view, used for the /api/v1/auth proxy rewrite (see
      # `src/lib/auth-proxy.ts`). That rewrite runs in this container, where
      # `localhost:8000` is this container and not the API -- without this the
      # proxy fails with ECONNREFUSED and every login returns a 500.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  pgdata:
  redisdata:
  uploads:
